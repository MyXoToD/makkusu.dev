# Site config, baked into the image (was: ./nginx/nginx.conf mounted from the
# server, which meant it lived in no repo at all).
#
# Ported from that file, minus everything the shared edge proxy now owns:
# TLS termination, the HTTP -> HTTPS redirect, HTTP/2, and the certbot
# acme-challenge location. What's left is the site's own behavior. The proxy
# forwards the original Host and User-Agent, so the www redirect and the bot
# filter below still see what the visitor actually sent.

server_tokens off;
charset utf-8;

# gzip compression
gzip on;
gzip_types text/plain text/xml text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml image/webp;
gzip_vary on;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;

server {
    listen 80;
    server_name makkusu.dev www.makkusu.dev;

    root /usr/share/nginx/html;
    index index.html;

    # Canonical host: www -> apex, preserving the path. https:// is correct
    # here even though this server block speaks HTTP — the visitor reached
    # the edge over TLS, and that is where the redirect sends them back to.
    if ($host = www.makkusu.dev) {
        return 301 https://makkusu.dev$request_uri;
    }

    # Block common malicious bot user agents
    if ($http_user_agent ~* (semrush|ahrefs|mj12bot|wget|curl|python-requests|scrapy)) {
        return 403;
    }

    # Serve the site's own 404 page rather than nginx's default one. (The old
    # config never set this, so the styled 404.html the build produces was
    # going unused — the .htaccess ErrorDocument stopped applying when the
    # site moved off Apache.)
    error_page 404 /404.html;

    # block common requests that dont exist anyway
    location ~* ^/(wp-admin|wp-login|xmlrpc\.php|login|admin|dashboard|user|cms) {
        return 403;
    }

    # Fonts change essentially never.
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Styles, scripts, images — a week, matching the old .htaccess intent
    # (max-age=604800), now expressed in the server that actually runs.
    location ~* \.(?:css|js|jpe?g|png|webp|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML is revalidated every time so a deploy is visible immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
